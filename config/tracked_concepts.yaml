# Each entry:
#   id:            stable concept id; file lives at okf/<resource>/<id>.md
#   title:         human-readable title (frontmatter)
#   resource:      bundle category; must match the parent folder (OKF009)
#   tags:          frontmatter tags (only used when creating a new doc)
#   related:       related concept ids; must exist in the bundle (OKF007)
#   key_actors:    deterministic Key Actors list for newly created docs
#   search_query:  query sent to Tavily for this concept
#   lookback_days: optional per-concept override (default from config)
#   max_results:   optional per-concept override (default from config)

