name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality-gate:
    name: Lint, typecheck, test, validate, audit
    runs-on: ubuntu-latest
    steps:
      # 1. checkout + setup python
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 2. restore dependency cache
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # 3. install production dependencies (pinned lock)
      - name: Install production dependencies
        run: pip install --requirement requirements.txt

      # 4. install development dependencies (pinned)
      - name: Install development dependencies
        run: pip install --requirement requirements-dev.txt

      # 5. ruff (report only; auto-fix belongs to pre-commit)
      - name: Ruff
        run: ruff check .

      # 6. black --check
      - name: Black check
        run: black --check .

      # 7. mypy
      - name: mypy
        run: mypy

      # 8. unit tests
      - name: Unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee test-output.txt

      # 9. validator (the bundle must always pass)
      - name: Validate OKF bundle
        run: python -m validator validate okf

      # 10. dependency vulnerability audit
      - name: pip-audit
        run: pip-audit --requirement requirements.txt

      # 12. upload test results as an artifact
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.sha }}
          path: test-output.txt
          retention-days: 14

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      # 11. docker build (buildx; no push from CI)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: okf-api:ci-${{ github.sha }}
          build-args: |
            OKF_API_GIT_SHA=${{ github.sha }}
            OKF_API_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
